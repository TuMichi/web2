<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba Drag and drop</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="image-container">
        <div id="source" class="source" draggable="true" ondragstart="drag(e)">
            <img id="Lumi" src="iconos/Lumi1-pfp.webp" alt="Lumi" height="50" width="50">
        </div>
    
        <div id="target" class="target" ondrop="drop(event)" ondragover="allowDrop(e)">
            <img src="images/AguasHTMap.webp" alt="Aguas" height="550" width="750">
        </div>
    <div>
    <script src="scripts.js"></script>
        
</body>
</html>
